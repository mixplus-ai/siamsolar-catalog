[build]
  publish = "."

# เปิดหน้าแอดมินด้วย https://<ชื่อเว็บ>.netlify.app/admin
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# ไม่เปิดให้ดาวน์โหลดสำเนาโค้ด Apps Script จากหน้าเว็บ
[[redirects]]
  from = "/apps-script/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/apps-script-loader/*"
  to = "/index.html"
  status = 404
  force = true

# นามบัตรเซลล์ /vcard สร้างโดย netlify/functions/vcard.mjs
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
